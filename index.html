<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Image Upload Test</title>
<style>
body{margin:0;padding:24px;background:#10131a;color:#f4f5f7;font:16px system-ui,sans-serif}
.card{max-width:680px;margin:auto;background:#181d27;border:1px solid #303746;border-radius:16px;padding:22px}
h1{font-size:22px;margin-top:0}p{color:#aab2bf}
input[type=file]{display:block;width:100%;padding:14px;margin:18px 0;background:#222936;color:#fff;border:1px solid #485266;border-radius:10px;font-size:16px}
#status{padding:12px;border-radius:10px;background:#0d1016;margin:12px 0;word-break:break-word}
#preview{display:block;max-width:100%;max-height:60vh;margin-top:16px;border-radius:8px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h1>Image Upload Test</h1>
<p>This is a deliberately tiny Safari/iPhone test. It does not use AI, Canvas, external libraries or a server.</p>
<input id="file" type="file" accept="image/*">
<div id="status">Waiting for image…</div>
<img id="preview" class="hidden" alt="Selected image preview">
</div>
<script>
(function(){
  const input=document.getElementById("file");
  const status=document.getElementById("status");
  const preview=document.getElementById("preview");

  function say(text){status.textContent=text;}

  input.addEventListener("change", function(){
    say("CHANGE EVENT FIRED");
    const file=input.files && input.files[0];
    if(!file){say("The picker closed without a file.");return;}
    say("File received: "+file.name+" ("+file.type+", "+file.size+" bytes)");

    const reader=new FileReader();
    reader.onload=function(){
      preview.onload=function(){
        preview.classList.remove("hidden");
        say("SUCCESS — Safari passed the image to the page. "+file.name);
      };
      preview.onerror=function(){
        say("File received, but Safari could not decode this image.");
      };
      preview.src=reader.result;
    };
    reader.onerror=function(){say("FileReader error: "+reader.error);};
    reader.readAsDataURL(file);
  });
})();
</script>
</body>
</html>
